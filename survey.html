<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
    <link rel="stylesheet" href="css/survey.css"
  </head>

  <body>
<h1 id="title">Are you happy?</h1>
<p id="description">We want to how happy you are day to day.</p>
<form id="survey-form">
  <label id="name-label" for="name">Name: </label>
  <input id="name" type="text" placeholder="Sarah Crinlker" required>

  <section>
<label id="email-label" for="email">Email: </label>
  <input id="email" type="email" placeholder="scrinklr@example.com" required>
</section>

<label id="number-label">On a scale of 1 - 10, how happy are you day to day?</label>
<input id="number" type="number" min="0" max="10" placeholder="5">

<section>
<label for="dropdown" id="dropdown-label">Are you more of a day person or night person?</label>
<select id="dropdown">
<option>morning</option>
<option>night</option>
<option>varies</option>
</select>
</section>

<section>
<h2>Do you believe you are in control of your own happiness?</h2>
<input type="radio" id="yes" value="yes" name="radio">
<label id="yes-label" for="yes">yes</label>

<input type="radio" id="no" value="no" name="radio">
<label id="no-label" for="no">no</label>
</section>

<section>
    <h2>When is a good time for you to do things that bring you hapiness?</h2>
<input id="weekdays" type="checkbox" value="Weekdays">
<label id="weekdays-label" for="weekdays">Weekdays</label>

<input id="weekends" type="checkbox" value="weekends">
<label for="weekends" id="weekends-label">Weekends</label>
</section>


<button type="submit" id="submit">Submit</button>

</form>


  </body>
</html>
